<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wintertraining 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: schmale App-Spalte; oben Wochenleiste 0–13, darunter drei Einheiten-Karten; Trainerinnen-Ansicht als Tabelle + Detail */
:root{
  --bg:#edf1f4; --surface:#ffffff; --sunken:#e3e9ee; --ink:#0f1d2b; --muted:#566778; --line:#d3dbe3;
  --accent:#0a5f86; --accent-ink:#ffffff; --done:#2c7a4b; --done-soft:#e1f1e7; --warn:#a85a17;
  --readout:#17262b; --readout-ink:#b9f0cf;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141b; --surface:#141f29; --sunken:#0f1820; --ink:#e3eaf0; --muted:#8c9eaf; --line:#25333f;
  --accent:#4cb0de; --accent-ink:#06202c; --done:#62c189; --done-soft:#173325; --warn:#e09a55;
  --readout:#0a1214; --readout-ink:#9fe8bd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141b; --surface:#141f29; --sunken:#0f1820; --ink:#e3eaf0; --muted:#8c9eaf; --line:#25333f;
  --accent:#4cb0de; --accent-ink:#06202c; --done:#62c189; --done-soft:#173325; --warn:#e09a55;
  --readout:#0a1214; --readout-ink:#9fe8bd; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1}
h2{font-size:22px}
h3{font-size:19px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:4px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.userbar{display:flex;align-items:center;gap:4px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.notice.warn{border-color:var(--warn)}

/* Kopfzeile Ruderin */
.me{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:18px}
@media (max-width:620px){.me{grid-template-columns:1fr}.tests{justify-content:space-between}.tests div{min-width:0;padding:0 6px}}
.me .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.tests{display:flex;gap:2px;background:var(--readout);color:var(--readout-ink);border-radius:10px;padding:8px 6px}
.tests div{display:flex;flex-direction:column;align-items:center;padding:0 10px;min-width:64px}
.tests span{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.tests b{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.tests div+div{border-left:1px solid rgb(185 240 207 / .18)}

/* Wochenleiste */
.weeks{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin-bottom:18px}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px}
.wk .n{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1}
.wk .dots{display:flex;gap:3px}
.wk .dots i{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--muted);opacity:.55}
.wk .dots i.on{background:var(--done);border-color:var(--done);opacity:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-10px 0 16px;align-items:center}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend i.open{border:1.5px solid var(--muted);opacity:.55}
.legend i.on{background:var(--done)}
.btn.check{display:inline-flex;align-items:center;gap:8px;border-color:var(--done);color:var(--done)}
.btn.check .box{width:16px;height:16px;border:2px solid currentColor;border-radius:4px}
.btn.check:hover .box{background:var(--done-soft)}
.pill.open{background:transparent;border:1px solid var(--line)}
.wk[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wk.full{background:var(--done-soft)}
@media (max-width:620px){.weeks{grid-template-columns:repeat(7,minmax(0,1fr))}}

.weekhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.units{grid-template-columns:1fr}}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.unit.done{border-color:var(--done)}
.unit .tag{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--done-soft);color:var(--done)}
.pill.test{background:var(--readout);color:var(--readout-ink);font-family:var(--f-mono);font-weight:500}
.unit .desc{white-space:pre-line;color:var(--muted)}
.readout{background:var(--readout);color:var(--readout-ink);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.readout .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.readout .lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.readout .val{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.readout .own{font-size:14px;font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.vals{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.vals b{font-family:var(--f-mono);font-weight:500}
.comment{font-size:14px;border-left:2px solid var(--line);padding-left:10px;white-space:pre-line;overflow-wrap:anywhere}

form.entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:12px}
form.entry .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.timeparts{display:flex;align-items:flex-end;gap:6px;margin-top:3px}
.timeparts label{flex:0 0 auto;font-size:11px}
.timeparts input{width:64px;text-align:center;font-family:var(--f-mono);font-size:18px}
.timeparts .sep{font-family:var(--f-mono);font-size:22px;color:var(--ink);padding-bottom:6px}
.rpe{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:34px;height:32px;font-family:var(--f-mono)}
.rpe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Anmeldung */
.reg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:18px}
.namegrid{display:flex;flex-wrap:wrap;gap:6px}
.namegrid button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px}
.namegrid button:hover{border-color:var(--accent)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.inline > *{flex:1 1 160px}
.inline .btn{flex:0 0 auto}

/* Trainerin */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{margin-bottom:10px}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
tr.sel td{background:var(--sunken)}
tr.pending td{color:var(--muted)}
.bar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}
.faster{color:var(--done)} .slower{color:var(--warn)}
.feed{display:flex;flex-direction:column;gap:12px}
.feed .it{display:flex;flex-direction:column;gap:3px}
.feed .meta{font-size:13px;color:var(--muted)}
.detail .wrow{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.detail .wrow .wn{font-family:var(--f-display);font-weight:700;font-size:20px}
.detail .cell{font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.detail .cell .comment{font-size:13px}
@media (max-width:620px){.detail .wrow{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.unit,.wk{transition:border-color .15s,background .15s}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Rennruderinnen · 19.10.2026 – 22.02.2027</span>
      <h1>Wintertraining 26/27</h1>
    </div>
    <div class="hdr-right"><div class="userbar" id="userbar" hidden></div><nav class="tabs" id="tabs" role="tablist" hidden></nav></div>
  </header>
  <div id="app"><div class="empty">Plan wird geladen …</div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Plan (aus Wintertraining_26_27.xlsx) ---------- */
const BASE = {1:[120,130], 2:[130,140]}; // Split-Korridor /500 m in Sekunden
const ROSTER = {
  1:["Annalena","Anne Beyrich","Johanna","Julika","Lea","Lina","Maria","Marieke","Martha","Merle","Sophie","Veronika"],
  2:["Angelina","Anne Bauer","Birthe","Carrie","Elizabeth","Hannah","Jule","Juliane","Kathi","Katrin","Kristina","Melissa","Nicola","Stella","Bea","Veronika („Ika“)"]
};
const ZIRKEL = {title:"Zirkeltraining", desc:"Online verfügbar – kann individuell nachgeholt werden."};
const PLAN = [
 {kraft:{title:"Besprechung Winterplan & 1.000-m-Test", desc:"Gemeinsamer Auftakt mit Eingangstest.", test:"start"},
  ergo:{title:"3 × 10 min", desc:"SZ 20–22 · 2 min Pause", split:[{off:[20,25]}]},
  aus:{title:"Radfahren", desc:"45 min · locker"}},
 {ergo:{title:"2 × 15 min", desc:"SZ 22–24 · 4 min Pause", split:[{off:[15,20]}]},
  aus:{title:"Schwimmen", desc:"30 min · gleichmäßig und durchschwimmen"}},
 {ergo:{title:"4 × 8 min + 15 min konstant", desc:"1 min Pause · SZ 22–24", split:[{label:"4 × 8 min",off:[10,15]},{label:"15 min",own:"eigene Einschätzung – Gefühl bekommen"}]},
  aus:{title:"Gehen oder Joggen", desc:"60 min schnelles Gehen oder 30 min joggen"}},
 {ergo:{title:"2 × 12 min + 4 × 5 min", desc:"2 × 12 min SZ 24–26, 2 min Pause\n4 × 5 min SZ 24, 1 min Pause", split:[{off:[10,15]}]},
  aus:{title:"Radfahren", desc:"60 min · moderat bis schnell"}},
 {ergo:{title:"3 × 10 min", desc:"SZ-Steigerung 22 → 24 → 26 · 2 min Pause", split:[{off:[5,10]}]},
  aus:{title:"Laufen", desc:"40 min · Intervalle: 5 × 3 min zügiger"}},
 {ergo:{title:"6 × 4 min", desc:"SZ 26–28 · 1 min Pause", split:[{off:[5,10]}]},
  aus:{title:"Schwimmen", desc:"40 min · gern unterschiedlich schnell"}},
 {ergo:{title:"2 × 15 min", desc:"SZ 22–24 · 2 min Pause", split:[{off:[10,15]}]},
  aus:{title:"Wandern / schnelles Spazieren", desc:"60 min · moderat"}},
 {ergo:{title:"Ergo-Test 1.000 m", desc:"Gern vor Weihnachten fahren!", split:[{own:"eigene Einschätzung – Gefühl bekommen"}], test:"mid"},
  aus:{title:"Laufen", desc:"45 min"}},
 {ergo:{title:"40 min Rudern", desc:"Alle 5 min: 1 min Sprint bei SZ 30", split:[{own:"eigene Einschätzung"}]},
  aus:{title:"Radfahren", desc:"90 min · konstantes Tempo"}},
 {ergo:{title:"5 × 3 min", desc:"SZ 28–30 · 2 min Pause", split:[{off:[10,15]}]},
  aus:{title:"Schwimmen", desc:"45 min · Ausdauer"}},
 {ergo:{title:"2 × 1.000 m + 15 min locker", desc:"Eigene SZ · 3 min Pause\ndanach 15 min locker rudern, SZ 20–22", split:[{label:"1.000 m",own:"eigener Split"},{label:"Ausrudern",off:[15,20]}]},
  aus:{title:"Laufen", desc:"60 min · Ausdauer"}},
 {ergo:{title:"7.500 m Rudern", desc:"Wettkampf-Niveau fühlen\nAlternative: 30 min Ergo-Challenge", split:[{own:"eigene Einschätzung"}]},
  aus:{title:"Schwimmen", desc:"50 min · Tempowechsel"}},
 {ergo:{title:"20 min locker + 2 × 500 m Sprint", desc:"SZ 20–24 · 1 min Pause", split:[{label:"Locker",off:[10,15]},{label:"Sprint",own:"eigene Einschätzung"}]},
  aus:{title:"Laufen", desc:"60 min · durchgehend, gern Tempowechsel"}},
 {ergo:{title:"Ergo-Test 1.000 m", desc:"Abschlusstest – Vergleich mit Woche 0.", split:[{own:"eigene Einschätzung"}], test:"end"},
  aus:{title:"Rad + Laufen", desc:"60 min Rad und 30 min Laufen"}}
];
const UNITS = [["kraft","Kraft"],["ergo","Ergo"],["aus","Ausdauer"]];
const TOTAL = PLAN.length*3;
const TESTS = [["start","Start","Woche 0","w0-kraft"],["mid","Zwischen","Woche 7","w7-ergo"],["end","Ende","Woche 13","w13-ergo"]];
function unitOf(w,u){ const p=PLAN[w]; if(u==="kraft") return p.kraft||ZIRKEL; return p[u]; }

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs={}, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") n.className=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else if(k==="text") n.textContent=v; else n.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); }
  return n;
}
function parseTime(s){
  if(s==null) return null; s=String(s).trim().replace(",",".");
  if(!s) return null;
  const m=s.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/); if(m) return (+m[1])*60+(+m[2]);
  if(/^\d+(\.\d+)?$/.test(s)) return +s;
  return null;
}
function fmt(sec, dec=true){
  if(sec==null||isNaN(sec)) return "–";
  const m=Math.floor(sec/60), r=sec-m*60;
  const ss = dec ? r.toFixed(1).padStart(4,"0") : String(Math.round(r)).padStart(2,"0");
  return m+":"+ss.replace(".",",");
}
function fmtDelta(d){ if(d==null) return "–"; const s=(d<0?"−":"+")+Math.abs(d).toFixed(1).replace(".",",")+" s"; return s; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString("de-DE",{day:"numeric",month:"short"}); }catch{ return ""; } }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function key(w,u){ return "w"+w+"-"+u; }
function testsOf(doc){
  const e=(doc&&doc.entries)||{}; const out={};
  for(const [id,, ,k] of TESTS){ out[id]=parseTime(e[k]&&e[k].test1000); }
  return out;
}
function doneCount(doc){ const e=(doc&&doc.entries)||{}; return Object.values(e).filter(x=>x&&x.done).length; }
function currentWeek(doc){
  const e=(doc&&doc.entries)||{};
  for(let w=0;w<PLAN.length;w++){ if(UNITS.some(([u])=>!(e[key(w,u)]&&e[key(w,u)].done))) return w; }
  return PLAN.length-1;
}
function lastAt(doc){ const e=(doc&&doc.entries)||{}; let m=null; for(const v of Object.values(e)){ if(v&&v.at&&(!m||v.at>m)) m=v.at; } return m; }

/* ---------- Zustand ---------- */
const CFG = window.WT_CONFIG || {};
const LS_KEY = "wt-login";
const S = { sb:null, login:null, role:null, me:undefined, all:null,
  tab:null, week:null, editing:null, draft:{}, sel:null, readonly:false, regEdit:false, loaded:false,
  auth:{code:"", busy:false, step:"code", role:null} };
function isCoach(){ return S.role==="coach"; }
function readLogin(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch{ return null; } }
function writeLogin(v){ try{ v ? localStorage.setItem(LS_KEY,JSON.stringify(v)) : localStorage.removeItem(LS_KEY); }catch{} }

/* ---------- Laden & Schreiben (Supabase) ---------- */
async function call(fn,args){
  const {data,error}=await S.sb.rpc(fn,args);
  if(error){ const e=new Error(error.message||"rpc"); e.wrongCode=/wrong_code/.test(error.message||""); throw e; }
  return data;
}
function rowsToEntries(rows){
  const e={};
  for(const r of rows||[]) e[r.entry_key]={...(r.data||{}), done:true, at:r.done_at};
  return e;
}
function handleError(err, msg){
  console.error(err);
  if(err&&err.wrongCode){ logout(); toast("Der Team-Code hat sich geändert. Bitte neu anmelden."); return; }
  toast(msg||"Verbindung fehlgeschlagen. Bitte noch einmal versuchen.");
}
async function loadMe(){
  try{
    const d=await call("wt_me",{p_code:S.login.code, p_name:S.login.name});
    S.me = d ? {name:d.name, group:d.grp, role:"rower", entries:rowsToEntries(d.entries)} : null;
  }catch(err){ S.me=null; handleError(err,"Daten konnten nicht geladen werden."); }
}
async function loadAll(){
  try{
    const d=await call("wt_overview",{p_code:S.login.code});
    S.all=(d||[]).map(x=>({id:x.name, data:{name:x.name, group:x.grp, role:"rower", entries:rowsToEntries(x.entries)}}));
  }catch(err){ S.all=[]; handleError(err,"Übersicht konnte nicht geladen werden."); }
}
async function saveEntry(w,u,data){
  const k=key(w,u), prev=S.me.entries[k];
  const at=(prev&&prev.at)||new Date().toISOString();
  S.me.entries[k]={...data, done:true, at};
  S.editing=null; S.draft={}; render();
  try{ await call("wt_save",{p_code:S.login.code, p_name:S.me.name, p_key:k, p_data:data, p_done_at:at}); toast("Gespeichert"); }
  catch(err){ if(prev) S.me.entries[k]=prev; else delete S.me.entries[k]; render(); handleError(err,"Speichern fehlgeschlagen. Bitte noch einmal versuchen."); }
}
async function clearEntry(w,u){

/* ---------- Rendering ---------- */
function render(){
  const app=$("#app"); app.replaceChildren();
  const tabs=$("#tabs"); tabs.replaceChildren();
  const bar=$("#userbar"); bar.replaceChildren(); bar.hidden=true;
  if(!S.loaded){ app.append(el("div",{class:"empty"},"Plan wird geladen …")); return; }

  if(!S.sb){
    app.append(el("div",{class:"notice warn"},"Die Datenbank ist noch nicht eingerichtet (config.js). Bis dahin ist nur der Plan zu sehen."));
    S.week = S.week ?? 0; app.append(planView(null,true)); return;
  }
  // Noch nicht angemeldet bzw. Name noch nicht gewählt
  if(!S.login || (S.role==="team" && !S.login.name)){
    app.append(S.auth.step==="name" ? regView() : authView());
    S.week = S.week ?? 0; app.append(el("h2",{style:"margin:28px 0 12px"},"Der Plan"), planView(null,true)); return;
  }

  bar.hidden=false;
  bar.append(el("span",{class:"muted"}, isCoach()?"Trainerin":S.login.name), el("button",{class:"btn ghost",onclick:logout},"Abmelden"));

  if(isCoach()){
    tabs.hidden=false;
    if(!S.tab) S.tab="coach";
    for(const [id,lbl] of [["plan","Plan"],["coach","Trainerin"]]){
      tabs.append(el("button",{role:"tab","aria-selected":String(S.tab===id),onclick:()=>{S.tab=id; render();}},lbl));
    }
    if(S.tab==="coach"){ app.append(coachView()); return; }
    S.week=S.week??0; app.append(planView(null,true)); return;
  }
  tabs.hidden=true;
  if(S.me===undefined){ app.append(el("div",{class:"empty"},"Profil wird geladen …")); return; }
  if(!S.me || S.regEdit){ app.append(regView()); return; }
  if(S.week==null) S.week=currentWeek(S.me);
  app.append(meHeader(), planView(S.me, S.readonly));
}

const FIELDS = {
  kraft:[["dauer","Dauer","z. B. 40 min"]],
  ergo:[["dauer","Zeit / Dauer","z. B. 30:00"],["meter","Meter","z. B. 7200","numeric"],["sz","Schlagzahl","z. B. 22","numeric"],["split","Ø Split /500 m","z. B. 2:18,5"]],

};
function fieldsFor(w,u){ const p=unitOf(w,u); return p.test ? FIELDS.ergo.filter(([n])=>n==="sz"||n==="split") : FIELDS[u]; }
const LABELS={dauer:"Zeit",meter:"Meter",sz:"SZ",split:"Split",sport:"Sport",strecke:"Strecke"};

function unitCard(w,u,lbl,entry,group,ro){
  const p=unitOf(w,u), done=!!(entry&&entry.done), k=key(w,u);
  const card=el("article",{class:"unit"+(done?" done":"")});
  card.append(el("div",{class:"tag"},
    el("span",{class:"eyebrow"}, u==="kraft"&&w===0?"Auftakt":lbl),
    ro&&!entry ? (p.test?el("span",{class:"pill test"},"1.000 m Test"):null)
      : done?el("span",{class:"pill ok"},"✓ erledigt"):el("span",{class:"pill open"},"offen")));
  if(p.test && !(ro&&!entry)) card.append(el("span",{class:"pill test",style:"align-self:flex-start"},"1.000 m Test"));
  card.append(el("h3",{},p.title));
  if(p.desc) card.append(el("div",{class:"desc"},p.desc));
  if(u==="aus") card.append(el("div",{class:"muted",style:"font-size:13px"},"Beispiel – Ausdauer ist frei wählbar."));
  if(p.split) card.append(splitReadout(p.split,group));

  if(S.editing===k && !ro){ card.append(entryForm(w,u,p,entry)); return card; }

  if(done){
    const vals=el("div",{class:"vals"});
    if(entry.test1000) vals.append(el("span",{},"1.000 m ",el("b",{},fmt(parseTime(entry.test1000)))));
    for(const [f] of fieldsFor(w,u)) if(entry[f]) vals.append(el("span",{},LABELS[f]+" ",el("b",{},entry[f])));
    if(entry.rpe) vals.append(el("span",{},"Anstrengung ",el("b",{},entry.rpe+"/10")));
    card.append(el("div",{class:"muted",style:"font-size:13px"},"Bestätigt am "+fmtDate(entry.at)));
    if(vals.childNodes.length) card.append(vals);
    if(entry.comment) card.append(el("div",{class:"comment"},entry.comment));
  }
  if(!ro){
    const a=el("div",{class:"actions"});
    if(!done){
      if(!p.test) a.append(el("button",{class:"btn check",onclick:()=>saveEntry(w,u,{})},el("span",{class:"box","aria-hidden":"true"}),"Als erledigt markieren"));

    } else {
      a.append(el("button",{class:"btn",onclick:()=>{S.editing=k;S.draft={...entry};render();}},"Bearbeiten"));
      a.append(el("button",{class:"btn ghost",onclick:()=>clearEntry(w,u)},"Als offen markieren"));
    }
    card.append(a);
  }
  return card;
}

    for(const [u,lbl] of UNITS){
      const v=e[key(w,u)];
      const c=el("div",{class:"cell"},el("span",{class:"eyebrow",style:"font-size:11px"},lbl),el("span",{style:"font-weight:600"},unitOf(w,u).title));
      if(v&&v.done){ c.append(el("span",{style:"color:var(--done);font-weight:600"},"✓ "+fmtDate(v.at)));
        const l=entryLine(v,u); if(l) c.append(el("span",{class:"mono",style:"font-size:12px"},l));
        if(v.comment) c.append(el("div",{class:"comment"},v.comment)); }
      else c.append(el("span",{class:"muted"},"offen"));
      row.append(c);
    }
    p.append(row);
  });
  return p;
}

/* ---------- Start ---------- */
render();
(async()=>{
  if(!window.supabase || !CFG.url || !CFG.anonKey){ S.loaded=true; render(); return; }
  S.sb = window.supabase.createClient(CFG.url, CFG.anonKey, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
  const saved=readLogin();
  S.loaded=true;
  if(!saved||!saved.code){ render(); return; }
  S.login=saved; S.role=saved.role; render();
  try{ S.role=await call("wt_check",{p_code:saved.code}); S.login.role=S.role; }
  catch(err){ if(err.wrongCode){ logout(); toast("Der Code hat sich geändert. Bitte neu anmelden."); return; } }
  if(S.role==="coach"){ await loadAll(); render(); return; }
  if(!S.login.name){ S.auth.step="name"; render(); return; }
  await loadMe(); render();
})();
</script>
