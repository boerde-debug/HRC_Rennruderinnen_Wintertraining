<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HRC Rennruderinnen</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="HRC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a5f86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: schmale App-Spalte; oben Wochenleiste 0–13, darunter drei Einheiten-Karten; Trainerinnen-Ansicht als Tabelle + Detail */
:root{
  --bg:#edf1f4; --surface:#ffffff; --sunken:#e3e9ee; --ink:#0f1d2b; --muted:#566778; --line:#d3dbe3;
  --accent:#0a5f86; --accent-ink:#ffffff; --accent-soft:#dcecf4; --done:#2c7a4b; --done-soft:#e1f1e7; --warn:#c2246f;
  --readout:#17262b; --readout-ink:#b9f0cf;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141b; --surface:#141f29; --sunken:#0f1820; --ink:#e3eaf0; --muted:#8c9eaf; --line:#25333f;
  --accent:#4cb0de; --accent-ink:#06202c; --accent-soft:#12303f; --done:#62c189; --done-soft:#173325; --warn:#f272b0;
  --readout:#0a1214; --readout-ink:#9fe8bd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141b; --surface:#141f29; --sunken:#0f1820; --ink:#e3eaf0; --muted:#8c9eaf; --line:#25333f;
  --accent:#4cb0de; --accent-ink:#06202c; --accent-soft:#12303f; --done:#62c189; --done-soft:#173325; --warn:#f272b0;
  --readout:#0a1214; --readout-ink:#9fe8bd; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1}
h2{font-size:22px}
h3{font-size:19px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:4px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.userbar{display:flex;align-items:center;gap:4px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.notice.warn{border-color:var(--warn)}

/* Kopfzeile Ruderin */
.me{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:18px}
@media (max-width:620px){.me{grid-template-columns:1fr}.tests{justify-content:space-between}.tests div{min-width:0;padding:0 6px}}
.me .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.tests{display:flex;gap:2px;background:var(--readout);color:var(--readout-ink);border-radius:10px;padding:8px 6px}
.tests div{display:flex;flex-direction:column;align-items:center;padding:0 10px;min-width:64px}
.tests span{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.tests b{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.tests div+div{border-left:1px solid rgb(185 240 207 / .18)}

/* Wochenleiste */
.weeks{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin-bottom:18px}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px}
.wk .n{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1}
.wk .dots{display:flex;gap:3px}
.wk .dots i{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--muted);opacity:.55}
.wk .dots i.on{background:var(--done);border-color:var(--done);opacity:1}
.wk .dots i.bonus{border-radius:2px;transform:rotate(45deg) scale(.9);border-style:dashed;opacity:.8}
.wk .dots i.bonus.on{border-style:solid}
.legend i.bonus{border:1.5px dashed var(--muted);border-radius:2px;transform:rotate(45deg) scale(.8);opacity:.7}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-10px 0 16px;align-items:center}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend i.open{border:1.5px solid var(--muted);opacity:.55}
.legend i.on{background:var(--done)}
.btn.check{display:inline-flex;align-items:center;gap:8px;border-color:var(--done);color:var(--done)}
.btn.check .box{width:16px;height:16px;border:2px solid currentColor;border-radius:4px}
.btn.check:hover .box{background:var(--done-soft)}
.pill.open{background:transparent;border:1px solid var(--line)}
.unit.bonus:not(.done){border-style:dashed}
.wk[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wk.full{background:var(--done-soft)}
@media (max-width:620px){.weeks{grid-template-columns:repeat(7,minmax(0,1fr))}}

.weekhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.units{grid-template-columns:1fr}}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.unit.done{border-color:var(--done)}
.unit .tag{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--done-soft);color:var(--done)}
.pill.test{background:var(--readout);color:var(--readout-ink);font-family:var(--f-mono);font-weight:500}
.unit .desc{white-space:pre-line;color:var(--muted)}
.readout{background:var(--readout);color:var(--readout-ink);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.readout .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.readout .lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.readout .val{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.readout .own{font-size:14px;font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.vals{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.vals b{font-family:var(--f-mono);font-weight:500}
.comment{font-size:14px;border-left:2px solid var(--line);padding-left:10px;white-space:pre-line;overflow-wrap:anywhere}

form.entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:12px}
form.entry .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.timeparts{display:flex;align-items:flex-end;gap:6px;margin-top:3px}
.timeparts label{flex:0 0 auto;font-size:11px}
.timeparts input{width:64px;text-align:center;font-family:var(--f-mono);font-size:18px}
.timeparts .sep{font-family:var(--f-mono);font-size:22px;color:var(--ink);padding-bottom:6px}
.rpe{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:34px;height:32px;font-family:var(--f-mono)}
.rpe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Anmeldung */
.reg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:18px}
.namegrid{display:flex;flex-wrap:wrap;gap:6px}
.namegrid button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px}
.namegrid button:hover{border-color:var(--accent)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.inline > *{flex:1 1 160px}
.inline .btn{flex:0 0 auto}

/* Trainerin */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{margin-bottom:10px}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
tr.sel td{background:var(--sunken)}
tr.pending td{color:var(--muted)}
.bar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}
.faster{color:var(--done)} .slower{color:var(--warn)}
.feed{display:flex;flex-direction:column;gap:12px}
.feed .it{display:flex;flex-direction:column;gap:3px}
.feed .meta{font-size:13px;color:var(--muted)}
.detail .wrow{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.detail .wrow .wn{font-family:var(--f-display);font-weight:700;font-size:20px}
.detail .cell{font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.detail .cell .comment{font-size:13px}
@media (max-width:620px){.detail .wrow{grid-template-columns:1fr}}
/* Navigation + Startseite */
.back{display:inline-block;font-weight:600;color:var(--accent);text-decoration:none;margin-bottom:6px;font-size:14px}
.back:hover{text-decoration:underline}
.hello{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;color:var(--ink);text-decoration:none;min-height:170px;min-width:0}
.tile:hover{border-color:var(--accent);box-shadow:0 2px 10px rgb(0 0 0 / .06)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile .ti{width:40px;height:40px;color:var(--accent)}
.tile .ti svg{width:100%;height:100%}
.tile .tt{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.tile .tl{color:var(--muted);font-size:14px}
.tile .go{margin-top:auto;font-weight:600;color:var(--accent);font-size:14px}
.tile.soon{border-style:dashed;background:transparent;color:var(--muted)}
.tile.soon .tt{color:var(--muted)}
/* Wer macht was? */
.boardbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:inline-flex}
.seg.small button{padding:6px 12px}
.stack{display:flex;flex-direction:column;gap:10px}
.filters,.suggest{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.suggest .fchip{background:var(--bg);font-size:13px}
.grouph{margin-top:10px;font-size:20px}
.none{margin:0}
.donebtn{align-self:flex-start;padding-left:0;margin-top:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.task.mine{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.task.isdone{opacity:.7}
.task.isdone h3{text-decoration:line-through;text-decoration-thickness:1px}
.tcheck{width:28px;height:28px;border-radius:7px;border:2px solid var(--muted);background:transparent;color:var(--accent-ink);font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.tcheck:hover{border-color:var(--done)}
.tcheck[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.tbody{display:flex;flex-direction:column;gap:7px;min-width:0}
.thead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.thead h3{overflow-wrap:anywhere}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.due{font-weight:600}
.due.over{color:var(--warn)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{background:var(--sunken);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500}
.person.isme{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nobody{font-size:14px;color:var(--warn);font-weight:500}
.pill.kind-kurz{background:var(--sunken);color:var(--muted)}
.pill.kind-mittel{background:var(--accent-soft);color:var(--accent)}
.pill.free{background:var(--accent-soft);color:var(--accent)}
.pill.warnp{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn.danger{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.confirm{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;font-weight:600}
.tform{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.namegrid.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.intro{margin:0 0 4px;max-width:65ch}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.roles{grid-template-columns:1fr}}
.role{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.role.free{border-style:dashed}
.role.mine{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.role .desc{color:var(--muted);font-size:14px}
.holder{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.small{font-size:13px}
.takeform{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.hist{align-self:flex-start;padding-left:0;font-size:13px}
.history{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.history b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.unit,.wk{transition:border-color .15s,background .15s}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <a href="#" id="back" class="back" hidden>← Übersicht</a>
      <span class="eyebrow" id="hd-eyebrow">Saison 2026/27</span>
      <h1 id="hd-title">HRC Rennruderinnen</h1>
    </div>
    <div class="hdr-right"><div class="userbar" id="userbar" hidden></div><nav class="tabs" id="tabs" role="tablist" hidden></nav></div>
  </header>
  <div id="app"><div class="empty">Wird geladen …</div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Plan (aus Wintertraining_26_27.xlsx) ---------- */
const BASE = {1:[120,130], 2:[130,140]}; // Split-Korridor /500 m in Sekunden
const ROSTER = {
  1:["Annalena","Anne Beyrich","Johanna","Julika","Lea","Lina","Maria","Marieke","Martha","Merle","Sophie","Veronika"],
  2:["Angelina","Anne Bauer","Birthe","Carrie","Elizabeth","Hannah","Jule","Juliane","Kathi","Katrin","Kristina","Melissa","Nicola","Stella","Bea","Veronika („Ika“)"]
};
const ZIRKEL = {title:"Zirkeltraining", desc:"Online verfügbar – kann individuell nachgeholt werden."};
const PLAN = [
 {kraft:{title:"Besprechung Winterplan & 1.000-m-Test", desc:"Gemeinsamer Auftakt mit Eingangstest.", test:"start"},
  ergo:{title:"3 × 10 min", desc:"SZ 20–22 · 2 min Pause", split:[{off:[20,25]}]},
  aus:{title:"Radfahren", desc:"45 min · locker"}},
 {ergo:{title:"2 × 15 min", desc:"SZ 22–24 · 4 min Pause", split:[{off:[15,20]}]},
  aus:{title:"Schwimmen", desc:"30 min · gleichmäßig und durchschwimmen"}},
 {ergo:{title:"4 × 8 min + 15 min konstant", desc:"1 min Pause · SZ 22–24", split:[{label:"4 × 8 min",off:[10,15]},{label:"15 min",own:"eigene Einschätzung – Gefühl bekommen"}]},
  aus:{title:"Gehen oder Joggen", desc:"60 min schnelles Gehen oder 30 min joggen"}},
 {ergo:{title:"2 × 12 min + 4 × 5 min", desc:"2 × 12 min SZ 24–26, 2 min Pause\n4 × 5 min SZ 24, 1 min Pause", split:[{off:[10,15]}]},
  aus:{title:"Radfahren", desc:"60 min · moderat bis schnell"}},
 {ergo:{title:"3 × 10 min", desc:"SZ-Steigerung 22 → 24 → 26 · 2 min Pause", split:[{off:[5,10]}]},
  aus:{title:"Laufen", desc:"40 min · Intervalle: 5 × 3 min zügiger"}},
 {ergo:{title:"6 × 4 min", desc:"SZ 26–28 · 1 min Pause", split:[{off:[5,10]}]},
  aus:{title:"Schwimmen", desc:"40 min · gern unterschiedlich schnell"}},
 {ergo:{title:"2 × 15 min", desc:"SZ 22–24 · 2 min Pause", split:[{off:[10,15]}]},
  aus:{title:"Wandern / schnelles Spazieren", desc:"60 min · moderat"}},
 {ergo:{title:"Ergo-Test 1.000 m", desc:"Gern vor Weihnachten fahren!", split:[{own:"eigene Einschätzung – Gefühl bekommen"}], test:"mid"},
  aus:{title:"Laufen", desc:"45 min"}},
 {ergo:{title:"40 min Rudern", desc:"Alle 5 min: 1 min Sprint bei SZ 30", split:[{own:"eigene Einschätzung"}]},

const UNITS = [["ergo","Ergo"],["aus","Ausdauer"],["kraft","Kraft"]];

function unitsFor(w){ return PLAN[w].kraft ? [["kraft","Auftakt"],["ergo","Ergo"],["aus","Ausdauer"]] : UNITS; }

const $ = s => document.querySelector(s);

function parseTime(s){

function fmtDelta(d){ if(d==null) return "–"; const s=(d<0?"−":"+")+Math.abs(d).toFixed(1).replace(".",",")+" s"; return s; }

}

  box.append(el("div",{class:"row2"},el("div",{class:"f"},"Art",kind),el("label",{class:"f"},"Fällig am (optional)",due)));
  const me=myName();
  const names=allNames(); if(me){ const i=names.indexOf(me); if(i>0){ names.splice(i,1); names.unshift(me); } }
  const pick=el("div",{class:"namegrid pick"});
  for(const n of names) pick.append(el("button",{type:"button","aria-pressed":String(f.assignees.includes(n)),onclick:e=>{
    f.assignees = f.assignees.includes(n) ? f.assignees.filter(x=>x!==n) : [...f.assignees,n];
    e.currentTarget.setAttribute("aria-pressed",String(f.assignees.includes(n)));
  }},n===me?n+" (ich)":n));
  box.append(el("div",{class:"f"},"Wer macht es? (mehrere möglich, gern auch offen lassen)",pick));
  box.append(el("label",{class:"f"},"Notiz (optional)",el("textarea",{id:"task-notes",maxlength:"2000",placeholder:"Treffpunkt, Uhrzeit, Details …",oninput:e=>{f.notes=e.target.value;}},f.notes||"")));
  box.append(el("div",{class:"actions"},
    el("button",{class:"btn primary",type:"submit",disabled:S.busy},f.id?"Speichern":"Aufgabe anlegen"),
    el("button",{class:"btn ghost",type:"button",onclick:()=>{S.taskForm=null;render();}},"Abbrechen")));
  return box;
}

/* Ämter */
function rolesView(){
  const box=el("div",{class:"stack"});
  if(S.roleForm && !S.roleForm.id) box.append(roleForm(S.roleForm));
  box.append(el("p",{class:"muted intro"},"Ämter wechseln: Wer ein Amt übernimmt, kann eine Amtszeit festlegen und es danach wieder abgeben. Der Verlauf zeigt, wer es vorher hatte."));
  const roles=[...S.board.roles].sort((a,b)=>(!!a.holder-!!b.holder)||a.title.localeCompare(b.title,"de"));
  if(!roles.length) box.append(el("p",{class:"muted none"},"Noch keine Ämter angelegt."));
  const grid=el("div",{class:"roles"});
  for(const r of roles) grid.append(roleCard(r));
  box.append(grid);
  return box;
}
function roleCard(r){
  if(S.roleForm && S.roleForm.id===r.id) return roleForm(S.roleForm);
  const me=myName(), mine=me&&r.holder===me, today=isoToday();
  const expired=r.holder&&r.until&&r.until<today;
  const card=el("article",{class:"role"+(r.holder?"":" free")+(mine?" mine":"")});
  card.append(el("div",{class:"thead"},el("h3",{},r.title),
    !r.holder?el("span",{class:"pill free"},"frei"):expired?el("span",{class:"pill warnp"},"Amtszeit abgelaufen"):null));
  if(r.description) card.append(el("div",{class:"desc"},r.description));
  if(r.holder){
    card.append(el("div",{class:"holder"},chip(r.holder),el("span",{class:"muted"},"seit "+fmtDay(r.since,true))));
    card.append(el("div",{class:"muted small"}, r.until?(expired?"Geplant bis "+fmtDay(r.until,true)+" – Zeit für einen Wechsel.":"Amtszeit bis "+fmtDay(r.until,true)):"Keine Amtszeit festgelegt."));
  } else card.append(el("div",{class:"nobody"},"Niemand hat dieses Amt gerade."));

  const take=S.take&&S.take.id===r.id?S.take:null;
  if(take){
    const sel=el("select",{id:"take-who-"+r.id,onchange:e=>{take.who=e.target.value;}}, allNames().map(n=>el("option",{value:n,selected:n===take.who},n)));
    const until=el("input",{id:"take-until-"+r.id,type:"date",value:take.until||"",oninput:e=>{take.until=e.target.value;}});
    card.append(el("form",{class:"takeform",onsubmit:async ev=>{
      ev.preventDefault(); if(!take.who){ toast("Bitte eine Person wählen."); return; }
      const ok = take.mode==="until" ? await boardCall("wt_role_until",{p_id:r.id,p_until:take.until||null},"Amtszeit gespeichert")
                                     : await boardCall("wt_role_take",{p_id:r.id,p_name:take.who,p_until:take.until||null},take.who===me?"Du hast das Amt übernommen":"Eingetragen");
      if(ok){ S.take=null; render(); }
    }},
      take.mode==="until"?null:el("label",{class:"f"},"Wer?",sel),
      el("label",{class:"f"},"Amtszeit bis (optional)",until),
      r.holder&&take.mode!=="until"?el("p",{class:"muted small",style:"margin:0"},r.holder+" gibt das Amt damit ab."):null,
      el("div",{class:"actions"},el("button",{class:"btn primary",type:"submit",disabled:S.busy},take.mode==="until"?"Speichern":"Übernehmen"),
        el("button",{class:"btn ghost",type:"button",onclick:()=>{S.take=null;render();}},"Abbrechen"))));
  } else {
    const a=el("div",{class:"actions"});
    if(mine){
      a.append(el("button",{class:"btn",onclick:()=>{S.take={id:r.id,who:me,until:r.until||"",mode:"until"};render();}},"Amtszeit ändern"));
    }
    if(r.holder && (mine||isCoach())){
      if(S.confirm==="r"+r.id) a.append(el("span",{class:"confirm"},"Amt abgeben?",
        el("button",{class:"btn danger",onclick:()=>{S.confirm=null;boardCall("wt_role_release",{p_id:r.id},"Amt abgegeben");}},"Abgeben"),
        el("button",{class:"btn ghost",onclick:()=>{S.confirm=null;render();}},"Nein")));
      else a.append(el("button",{class:"btn",onclick:()=>{S.confirm="r"+r.id;render();}},"Abgeben"));
    }
    if(!mine){
      a.append(el("button",{class:"btn"+(r.holder?"":" primary"),onclick:()=>{S.take={id:r.id,who:me||allNames()[0],until:"",mode:"take"};render();}},
        me ? (r.holder?"Übernehmen":"Ich übernehme") : "Jemanden eintragen"));
    }
    a.append(el("button",{class:"btn ghost",onclick:()=>{S.roleForm={id:r.id,title:r.title,description:r.description||""};render();}},"Bearbeiten"));
    card.append(a);
  }
  const hist=(r.history||[]).filter(h=>h.to_date);
  if(hist.length){
    const open=S.histOpen===r.id;
    card.append(el("button",{class:"btn ghost hist",onclick:()=>{S.histOpen=open?null:r.id;render();}},(open?"▾ ":"▸ ")+"Verlauf · "+hist.length));
    if(open) card.append(el("ul",{class:"history"},hist.map(h=>el("li",{},el("b",{},h.holder)," · "+fmtDay(h.from_date,true)+" – "+fmtDay(h.to_date,true)))));
  }
  return card;
}
function roleForm(f){
  const box=el("form",{class:"panel tform",onsubmit:async ev=>{
    ev.preventDefault();
    if(!f.title.trim()){ toast("Bitte einen Namen für das Amt eingeben."); return; }
    const ok=await boardCall("wt_role_save",{p_id:f.id||null,p_title:f.title,p_description:f.description},f.id?"Gespeichert":"Amt angelegt");
    if(ok){ S.roleForm=null; render(); }
  }});
  box.append(el("h3",{},f.id?"Amt bearbeiten":"Neues Amt"));
  box.append(el("label",{class:"f"},"Bezeichnung",el("input",{id:"role-title",value:f.title,maxlength:"80",placeholder:"z. B. Getränkewartin",oninput:e=>{f.title=e.target.value;}})));
  box.append(el("label",{class:"f"},"Was gehört dazu? (optional)",el("textarea",{id:"role-desc",maxlength:"1000",oninput:e=>{f.description=e.target.value;}},f.description||"")));
  const a=el("div",{class:"actions"},
    el("button",{class:"btn primary",type:"submit",disabled:S.busy},f.id?"Speichern":"Amt anlegen"),
    el("button",{class:"btn ghost",type:"button",onclick:()=>{S.roleForm=null;S.confirm=null;render();}},"Abbrechen"));
  if(f.id){
    if(S.confirm==="rd"+f.id) a.append(el("span",{class:"confirm"},"Amt samt Verlauf löschen?",
      el("button",{class:"btn danger",type:"button",onclick:async()=>{S.confirm=null;const ok=await boardCall("wt_role_delete",{p_id:f.id},"Amt gelöscht");if(ok){S.roleForm=null;render();}}},"Löschen"),
      el("button",{class:"btn ghost",type:"button",onclick:()=>{S.confirm=null;render();}},"Nein")));
    else a.append(el("button",{class:"btn ghost",type:"button",onclick:()=>{S.confirm="rd"+f.id;render();}},"Amt löschen"));
  }
  box.append(a);
  return box;
}

/* ---------- Start ---------- */
render();
(async()=>{
  if(!window.supabase || !CFG.url || !CFG.anonKey){ S.loaded=true; render(); return; }
  S.sb = window.supabase.createClient(CFG.url, CFG.anonKey, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
  const saved=readLogin();
  S.loaded=true;
  if(!saved||!saved.code){ render(); return; }
  S.login=saved; S.role=saved.role; render();
  try{ S.role=await call("wt_check",{p_code:saved.code}); S.login.role=S.role; }
  catch(err){ if(err.wrongCode){ logout(); toast("Der Code hat sich geändert. Bitte neu anmelden."); return; } }
  if(S.role==="coach"){ render(); return; }
  if(!S.login.name){ S.auth.step="name"; render(); return; }
  await loadMe(); render();
})();
</script>
